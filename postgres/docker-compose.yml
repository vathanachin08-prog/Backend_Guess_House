version: '3.9'
services:
  postgres:
    image: postgres:17-alpine
    restart: always
    container_name: postgres-content-management-service
    ports:
      - 54322:5432
    environment:
      - POSTGRES_PASSWORD=1234
      - POSTGRES_USER=postgres
      - POSTGRES_DB=room_rental_db
    networks:
      - cf-cms-service

networks:
  cf-cms-service:
    name: cf-cms-service